<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin - TWOCO</title>
    <link href="fonts/inter.css" rel="stylesheet">
    <script src="vendor/supabase.js"></script>
    <script src="config.js?v=20261024"></script>
    <script src="catalogue.js?v=20261024"></script>
    <style>
        :root { --dark: #0d172e; --blue: #2563eb; --cyan: #38bdf8; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; color: var(--dark); }
        .navbar { background: var(--dark); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .brand-title { font-size: 1.5rem; font-weight: 800; color: white; }
        .brand-title span { color: var(--cyan); }
        .navbar button { width: auto; margin: 0; padding: 8px 14px; background: transparent; border: 1px solid #475569; color: white; }
        .wrap { max-width: 1400px; margin: 0 auto; padding: 0 20px 30px; }
        /* Deux colonnes indépendantes : tuteurs à gauche, facultés et matières à droite */
        .colonnes { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .colonne { min-width: 0; }
        .onglets { display: none; }
        @media (min-width: 1000px) {
            .colonne { position: sticky; top: 0; max-height: calc(100vh - 66px); overflow-y: auto; padding-right: 6px; }
        }
        @media (max-width: 999px) {
            .colonnes { grid-template-columns: 1fr; }
            .onglets { display: flex; gap: 8px; position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 12px 0; }
            .onglets button { flex: 1; background: #e2e8f0; color: var(--dark); }
            .onglets button.actif { background: var(--blue); color: white; }
            .colonne:not(.visible) { display: none; }
        }
        .login { max-width: 380px; margin: 80px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .login h2 { margin-top: 0; }
        input { width: 100%; padding: 12px; margin-top: 12px; border: 1px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; font: inherit; }
        button { font: inherit; cursor: pointer; border: none; border-radius: 10px; padding: 12px 18px; font-weight: 700; }
        .login button { width: 100%; margin-top: 16px; background: var(--blue); color: white; }
        .err { color: #b91c1c; font-weight: 600; margin-top: 12px; min-height: 1em; }
        h2.section { margin: 36px 0 14px; }
        .tuteur-card { background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; margin-bottom: 14px; display: flex; gap: 16px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .tuteur-card h3 { margin: 0 0 6px; }
        .tuteur-card p { margin: 3px 0; font-size: 0.92rem; }
        .actions { display: flex; gap: 8px; }
        .btn-v { background: #dcfce7; color: #166534; }
        .btn-n { background: #f1f5f9; color: #334155; }
        .btn-d { background: #fee2e2; color: #991b1b; }
        .vide { color: #64748b; }
        .bloc { background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; margin-bottom: 14px; }
        .bloc h3 { margin: 0; }
        .bloc-tete { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
        .bloc-tete p { margin: 4px 0 0; font-size: 0.85rem; color: #64748b; }
        .petit { padding: 8px 12px; font-size: 0.85rem; }
        .annee-titre { margin: 18px 0 6px; font-size: 0.95rem; }
        .sem { margin: 10px 0 4px; font-size: 0.8rem; font-weight: 600; color: #64748b; }
        .puces { display: flex; flex-wrap: wrap; gap: 6px; }
        .puce { display: inline-flex; align-items: center; gap: 6px; background: #f1f5f9; border-radius: 999px; padding: 6px 6px 6px 12px; font-size: 0.85rem; font-weight: 600; }
        .puce button { padding: 2px 8px; border-radius: 999px; background: #fee2e2; color: #991b1b; font-size: 0.8rem; }
        .ajout { display: grid; grid-template-columns: 2fr 1fr 2fr; gap: 8px; align-items: end; margin-top: 16px; padding-top: 16px; border-top: 1px solid #f1f5f9; }
        .ajout label { font-size: 0.8rem; font-weight: 600; color: #475569; }
        .ajout input { margin-top: 4px; padding: 10px; }
        .ajout button { background: var(--blue); color: white; padding: 11px 16px; grid-column: 1 / -1; }
        .ajout-fac { grid-template-columns: 2fr 2fr 1fr; border-top: none; margin-top: 8px; padding-top: 0; }
        @media (max-width: 600px) { .ajout, .ajout-fac { grid-template-columns: 1fr 1fr; } }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <section id="login" class="login" hidden>
        <h2>Connexion admin</h2>
        <form id="login-form">
            <input type="email" id="email" placeholder="Email" autocomplete="username" required>
            <input type="password" id="password" placeholder="Mot de passe" autocomplete="current-password" required>
            <button type="submit">Se connecter</button>
            <p class="err" id="login-err" role="alert"></p>
        </form>
    </section>

    <div id="panel" hidden>
        <div class="navbar">
            <div class="brand-title">TWO<span>CO</span> admin</div>
            <button id="logout" type="button">Se déconnecter</button>
        </div>
        <div class="wrap">
            <div class="onglets">
                <button type="button" class="actif" data-onglet="col-tuteurs">Tuteurs</button>
                <button type="button" data-onglet="col-matieres">Facultés et matières</button>
            </div>
            <div class="colonnes">
                <div class="colonne visible" id="col-tuteurs">
                    <h2 class="section">En attente de validation</h2>
                    <div id="liste-attente"></div>
                    <h2 class="section">Profils publiés</h2>
                    <div id="liste-valides"></div>
                </div>

                <div class="colonne" id="col-matieres">
                    <h2 class="section">Facultés et matières</h2>
                    <p class="vide">Les changements apparaissent tout de suite sur le site.</p>
                    <div id="catalogue"></div>
                    <form class="bloc" id="form-fac">
                        <h3>Ajouter une faculté</h3>
                        <div class="ajout ajout-fac">
                            <div><label for="fac-nom">Nom affiché</label><input id="fac-nom" placeholder="ex : Psychologie" maxlength="40" required></div>
                            <div><label for="fac-sous">Sous-titre</label><input id="fac-sous" placeholder="ex : Faculté des SSP" maxlength="80"></div>
                            <div><label for="fac-uni">Université</label><input id="fac-uni" value="UNIL" maxlength="20" required></div>
                            <button type="submit">Ajouter</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const db = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        function montrerLogin() { $('panel').hidden = true; $('login').hidden = false; }
        function montrerPanel() { $('login').hidden = true; $('panel').hidden = false; charger(); chargerCatalogueAdmin(); }

        $('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            $('login-err').textContent = '';
            const { error } = await db.auth.signInWithPassword({
                email: $('email').value.trim(),
                password: $('password').value
            });
            if (error) { $('login-err').textContent = 'Email ou mot de passe incorrect.'; return; }
            $('password').value = '';
            montrerPanel();
        });

        $('logout').addEventListener('click', async () => {
            await db.auth.signOut();
            montrerLogin();
        });

        function carte(t, actions) {
            return `
                <div class="tuteur-card">
                    <div>
                        <h3>${esc(t.prenom)} ${esc(t.nom)}</h3>
                        <p><strong>Faculté :</strong> ${esc(t.faculte)} - année ${esc(t.annee)}</p>
                        <p><strong>Matières :</strong> ${esc(t.matieres)}</p>
                        <p><strong>Prix :</strong> ${esc(t.prix)} | <strong>Lieu :</strong> ${esc(t.lieu)}</p>
                        <p><strong>WhatsApp :</strong> ${esc(t.whatsapp)}</p>
                        ${t.status === 'valide' ? `<p><strong>Clics WhatsApp :</strong> ${esc(t.compteur_clics || 0)} | ${t.badge_verifie ? '⭐ <strong>Vérifié</strong>' : '🌱 Nouveau'}</p>` : ''}
                        ${t.email ? `<p><strong>E-mail :</strong> ${esc(t.email)}</p>` : ''}
                        ${t.notes ? `<p><strong>Notes :</strong> ${Object.entries(t.notes).map(([m, n]) => esc(m) + ' ' + esc(n)).join(' | ')}</p>` : ''}
                        ${t.cgu_acceptees ? `<p><strong>CGU :</strong> ${esc(t.cgu_version)} acceptées le ${esc(new Date(t.cgu_date).toLocaleString('fr-CH'))}</p>` : ''}
                    </div>
                    <div class="actions">${actions.map(a =>
                        `<button type="button" class="${a.cls}" data-action="${a.action}" data-id="${esc(t.id)}">${a.label}</button>`
                    ).join('')}</div>
                </div>`;
        }

        let fiches = [];

        async function charger() {
            const { data, error } = await db.from('tuteurs').select('*').order('created_at', { ascending: false });
            fiches = data || [];
            if (error) {
                console.error(error);
                $('liste-attente').innerHTML = '<p class="vide">Impossible de charger les données. Vérifie ta connexion et les règles Supabase.</p>';
                return;
            }
            const attente = data.filter(t => t.status === 'en_attente');
            // Une candidature dont le numéro existe déjà = une modification de profil
            const dejaPublie = t => data.some(v => v.id !== t.id && v.whatsapp === t.whatsapp && v.status === 'valide');
            const valides = data.filter(t => t.status === 'valide');

            $('liste-attente').innerHTML = attente.length
                ? attente.map(t => carte(t, [
                    { cls: 'btn-v', action: 'valider', label: dejaPublie(t) ? 'Valider (remplace l\'ancien profil)' : 'Valider' },
                    { cls: 'btn-d', action: 'supprimer', label: 'Refuser' }])).join('')
                : '<p class="vide">Aucune candidature en attente.</p>';

            $('liste-valides').innerHTML = valides.length
                ? valides.map(t => carte(t, [
                    t.badge_verifie
                        ? { cls: 'btn-n', action: 'badge', label: 'Retirer ⭐' }
                        : { cls: 'btn-v', action: 'badge', label: '⭐ Vérifié' },
                    { cls: 'btn-n', action: 'depublier', label: 'Dépublier' },
                    { cls: 'btn-d', action: 'supprimer', label: 'Supprimer' }])).join('')
                : '<p class="vide">Aucun profil publié.</p>';
        }

        // Un seul écouteur pour tous les boutons (pas de onclick dans le HTML généré)
        $('panel').addEventListener('click', async (e) => {
            const btn = e.target.closest('button[data-action]');
            if (!btn) return;
            const { action, id } = btn.dataset;
            let resultat;

            if (action === 'supprimer') {
                if (!confirm('Supprimer définitivement ce profil ?')) return;
                resultat = await db.from('tuteurs').delete().eq('id', id).select();
            } else if (action === 'badge') {
                const t = fiches.find(x => String(x.id) === id);
                resultat = await db.from('tuteurs').update({ badge_verifie: !(t && t.badge_verifie) }).eq('id', id).select();
            } else {
                const statut = action === 'valider' ? 'valide' : 'en_attente';
                resultat = await db.from('tuteurs').update({ status: statut }).eq('id', id).select();
            }

            // Supabase ne renvoie pas d'erreur quand une règle RLS bloque : on vérifie qu'une ligne a bien été touchée
            if (resultat.error || !resultat.data || resultat.data.length === 0) {
                alert('Action refusée. Vérifie que tu es connecté avec le bon compte admin.');
                return;
            }

            // Modification de profil : la nouvelle fiche validée remplace les anciennes du même numéro
            if (action === 'valider') {
                const tel = (fiches.find(t => String(t.id) === id) || {}).whatsapp;
                if (tel) {
                    // Le nouveau profil garde le badge et les clics de l'ancien
                    const anciens = fiches.filter(t => t.whatsapp === tel && String(t.id) !== id && t.status === 'valide');
                    if (anciens.length) await db.from('tuteurs').update({
                        badge_verifie: anciens.some(t => t.badge_verifie),
                        compteur_clics: Math.max(...anciens.map(t => t.compteur_clics || 0))
                    }).eq('id', id);
                    const { error } = await db.from('tuteurs').delete().eq('whatsapp', tel).neq('id', id);
                    if (error) alert('Profil validé, mais l\'ancien profil n\'a pas pu être supprimé : supprime-le à la main.');
                }
            }
            charger();
        });

        // Sur téléphone : un onglet par colonne
        document.querySelector('.onglets').addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-onglet]');
            if (!btn) return;
            document.querySelectorAll('.onglets button').forEach(b => b.classList.toggle('actif', b === btn));
            document.querySelectorAll('.colonne').forEach(c => c.classList.toggle('visible', c.id === btn.dataset.onglet));
        });

        // ---------- Facultés et matières (tables Supabase "facultes" et "matieres")
        let cat = { facultes: [], matieres: [] };

        // "Sciences de la vie" -> "sciencesdelavie" (sert dans l'adresse des pages et dans les profils)
        function nouvelleCle(nom) {
            const base = nom.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 20) || 'fac';
            let cle = base, i = 2;
            while (cat.facultes.some(f => f.cle === cle)) cle = base + i++;
            return cle;
        }

        async function chargerCatalogueAdmin() {
            try {
                cat = await chargerCatalogue(db);
            } catch (e) {
                console.error(e);
                $('catalogue').innerHTML = '<p class="vide">Impossible de charger les facultés.</p>';
                return;
            }
            rendreCatalogue();
        }

        function rendreCatalogue() {
            const arbre = arbreCatalogue(cat, true);
            $('catalogue').innerHTML = cat.facultes.map(f => {
                const annees = arbre[f.cle].annees;
                const semestres = [...new Set(cat.matieres.filter(m => m.faculte_cle === f.cle && m.semestre).map(m => m.semestre))];
                const contenu = Object.keys(annees).length ? Object.keys(annees).map(a => {
                    const parSem = {};
                    cat.matieres.filter(m => m.faculte_cle === f.cle && m.annee === a)
                        .forEach(m => (parSem[m.semestre || ''] = parSem[m.semestre || ''] || []).push(m));
                    return `<p class="annee-titre"><strong>${esc(nomAnnee(a))}</strong></p>` +
                        Object.entries(parSem).map(([sem, liste]) =>
                            (sem ? `<p class="sem">${esc(sem)}</p>` : '') +
                            `<div class="puces">${liste.map(m =>
                                `<span class="puce">${esc(m.nom)}<button type="button" data-cat="suppr-mat" data-id="${m.id}" title="Supprimer">✕</button></span>`
                            ).join('')}</div>`).join('');
                }).join('') : '<p class="vide">Aucune matière : cette faculté n\'apparaît pas encore sur le site.</p>';
                return `
                    <div class="bloc">
                        <div class="bloc-tete">
                            <div>
                                <h3>${esc(f.nom)}</h3>
                                <p>${esc(f.sous_titre || '')}${f.sous_titre ? ' · ' : ''}${esc(f.universite)}</p>
                            </div>
                            <button type="button" class="btn-d petit" data-cat="suppr-fac" data-cle="${esc(f.cle)}">Supprimer la faculté</button>
                        </div>
                        ${contenu}
                        <form class="ajout" data-fac="${esc(f.cle)}">
                            <div><label>Nouvelle matière</label><input name="nom" placeholder="ex : Microéconomie" maxlength="80" required></div>
                            <div><label>Année</label><input name="annee" type="number" min="1" max="6" value="1" required></div>
                            <div><label>Semestre <span class="vide">(facultatif)</span></label><input name="semestre" list="sem-${esc(f.cle)}" placeholder="ex : Premier semestre" maxlength="40">
                                <datalist id="sem-${esc(f.cle)}">${semestres.map(s => `<option value="${esc(s)}">`).join('')}</datalist></div>
                            <button type="submit">Ajouter</button>
                        </form>
                    </div>`;
            }).join('');
        }

        // Supabase ne renvoie pas d'erreur quand une règle RLS bloque : on vérifie qu'une ligne a été touchée
        function ok(resultat) {
            if (resultat.error || !resultat.data || resultat.data.length === 0) {
                console.error(resultat.error);
                alert('Action refusée. Vérifie que tu es connecté avec le bon compte admin.');
                return false;
            }
            return true;
        }

        $('catalogue').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target.closest('form.ajout');
            if (!form) return;
            const cle = form.dataset.fac;
            const nom = form.nom.value.trim();
            const annee = String(Number(form.annee.value) || 1);
            const semestre = form.semestre.value.trim() || null;
            if (!nom) return;
            if (cat.matieres.some(m => m.faculte_cle === cle && m.annee === annee && m.nom.toLowerCase() === nom.toLowerCase()))
                return alert('Cette matière existe déjà pour cette année.');
            const ordre = Math.max(-1, ...cat.matieres.filter(m => m.faculte_cle === cle).map(m => m.ordre)) + 1;
            if (!ok(await db.from('matieres').insert([{ faculte_cle: cle, annee, semestre, nom, ordre }]).select())) return;
            chargerCatalogueAdmin();
        });

        $('catalogue').addEventListener('click', async (e) => {
            const btn = e.target.closest('button[data-cat]');
            if (!btn) return;
            if (btn.dataset.cat === 'suppr-mat') {
                const m = cat.matieres.find(x => String(x.id) === btn.dataset.id);
                if (!m || !confirm(`Supprimer la matière « ${m.nom} » ?\nLes tuteurs qui l'ont déjà choisie la gardent sur leur profil.`)) return;
                if (!ok(await db.from('matieres').delete().eq('id', m.id).select())) return;
            } else {
                const f = cat.facultes.find(x => x.cle === btn.dataset.cle);
                const n = fiches.filter(t => t.faculte === f.cle).length;
                if (!f || !confirm(`Supprimer la faculté « ${f.nom} » et toutes ses matières ?` +
                    (n ? `\n⚠️ ${n} profil(s) de tuteur sont rattachés à cette faculté : ils ne seront plus visibles sur le site.` : ''))) return;
                if (!ok(await db.from('facultes').delete().eq('cle', f.cle).select())) return;
            }
            chargerCatalogueAdmin();
        });

        $('form-fac').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nom = $('fac-nom').value.trim();
            if (!nom) return;
            const ordre = Math.max(-1, ...cat.facultes.map(f => f.ordre)) + 1;
            if (!ok(await db.from('facultes').insert([{
                cle: nouvelleCle(nom), nom, sous_titre: $('fac-sous').value.trim() || null,
                universite: $('fac-uni').value.trim() || 'UNIL', ordre
            }]).select())) return;
            $('fac-nom').value = ''; $('fac-sous').value = '';
            chargerCatalogueAdmin();
        });

        (async () => {
            const { data } = await db.auth.getSession();
            data.session ? montrerPanel() : montrerLogin();
        })();
    </script>
</body>
</html>
