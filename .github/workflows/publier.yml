# Publie le site sur GitHub Pages à chaque merge sur main.
# Avant de publier, remplace « ?v=dev » par le numéro du commit dans les pages :
# les navigateurs rechargent alors les fichiers modifiés au lieu de garder une vieille version.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Numéro de version sur les fichiers
        run: |
          VERSION="${GITHUB_SHA::8}"
          sed -i "s/?v=dev\"/?v=${VERSION}\"/g" *.html
          grep -c "?v=${VERSION}" *.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
