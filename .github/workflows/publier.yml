# Publie le site sur GitHub Pages à chaque merge sur main.
# Avant de publier, remplace « ?v=dev » par le numéro du commit dans les pages :
# les navigateurs rechargent alors les fichiers modifiés au lieu de garder une vieille version.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.essai1.outputs.page_url || steps.essai2.outputs.page_url || steps.essai3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Numéro de version sur les fichiers
        run: |
          VERSION="${GITHUB_SHA::8}"
          sed -i "s/?v=dev\"/?v=${VERSION}\"/g" *.html
          grep -c "?v=${VERSION}" *.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub Pages refuse parfois la mise en ligne pendant quelques minutes (« Fetching artifact metadata failed »).
      # On réessaie tout seul : après 1 minute, puis après 3 minutes. Si le 3e essai échoue aussi, GitHub envoie un e-mail.
      - id: essai1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Attendre 1 minute avant de réessayer
        if: steps.essai1.outcome == 'failure'
        run: sleep 60
      - id: essai2
        if: steps.essai1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Attendre 3 minutes avant le dernier essai
        if: steps.essai1.outcome == 'failure' && steps.essai2.outcome == 'failure'
        run: sleep 180
      - id: essai3
        if: steps.essai1.outcome == 'failure' && steps.essai2.outcome == 'failure'
        uses: actions/deploy-pages@v4
