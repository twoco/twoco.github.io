# Garde la base Supabase (offre gratuite) active : sans aucune activité pendant ~7 jours,
# Supabase met le projet en pause. Tous les 3 jours, on lit la liste des facultés,
# comme le ferait un visiteur (clé publique « anon », déjà présente dans config.js).
# Si la base ne répond pas (projet en pause, panne), la tâche échoue et GitHub prévient par e-mail.
# Elle se réactive aussi elle-même : GitHub coupe les tâches planifiées d'un dépôt public
# resté 60 jours sans changement, sauf si la tâche est « réactivée » entre-temps.
name: Garder Supabase actif

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  visite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lire la liste des facultés
        run: |
          URL=$(grep -o "SUPABASE_URL: '[^']*'" config.js | cut -d"'" -f2)
          CLE=$(grep -o "SUPABASE_ANON_KEY: '[^']*'" config.js | cut -d"'" -f2)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/facultes?select=cle&limit=1" \
            -H "apikey: $CLE" -H "Authorization: Bearer $CLE")
          echo "Réponse de Supabase : $CODE"
          test "$CODE" = "200"
      - name: Rester activée (sans modifier le dépôt)
        continue-on-error: true  # ne pas confondre avec une panne de Supabase
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/garder-actif.yml/enable"
